# Firebase App Hosting configuration
# Documentation: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: ""
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "training-ia-8f67f.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "training-ia-8f67f"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "training-ia-8f67f.firebasestorage.app"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: ""
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: ""
  - variable: ENCRYPTION_MASTER_KEY
    secret: sgea-encryption-master-key
  - variable: GEMINI_API_KEY
    secret: gemini-api-key
